# Example preset row for `dsh-audit-gate`.
#
# Drop this row into your agent preset's `agent.cordis.yml` (the plugin
# publishes no service, so it may sit loose in a preset like `tool-bash`).
# The audit is a cheap-model subagent (`auditModel`) that generates and runs
# the language-appropriate checks itself, reviews code style, and checks
# documentation coverage.

- id: audit-gate
  name: dsh-audit-gate
  config:
    enabled: true
    guardCompletion: true            # deny `update_goal` complete until verified
    guardTurnEnd: modified           # off | modified | always
    maxAttempts: 5
    onInconclusive: deny             # deny | warn | allow —— block completion on an unverified audit by default
    registerTool: true               # register the model-facing `run_audit` tool
    toolName: run_audit
    # workdir: ~                     # optional override; defaults to the agent's cwd
    mutatingTools:
      - write
      - edit
      - bash
      - pwsh
    auditProvider: deepseek-official # provider serving the cheap audit subagent
    auditModel: deepseek-v4-flash    # cheap model that performs the audit
    subagentProvider: spawn          # subagent provider to spawn the audit with
    auditExecName: audit_exec        # host-controlled check runner (replaces bash for the audit subagent)
    maxAuditTimeoutMs: 300000        # total audit budget
    commandTimeoutMs: 120000         # per-command budget
    checkStyle: true                 # have the audit review code style
    checkLogic: true                 # have the audit hunt for real logic bugs
    checkFunction: true              # have the audit verify the requested functionality works
    checkDocs: true                  # have the audit check documentation coverage
    # styleGuide: .editorconfig      # optional style-guide file (absolute or workspace-relative)
